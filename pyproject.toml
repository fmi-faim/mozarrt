[project]
authors = [{name = "Jan Eglinger", email = "jan.eglinger@fmi.ch"}]
dependencies = ["ngio", "pandas"]
name = "mcoz"
requires-python = ">= 3.11"
version = "0.1.0"
description = "MoBIE Collections from OME-Zarr"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
mcoz = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.13.*"
ngio = ">=0.4.4,<0.5"
pandas = ">=2.3.3,<3"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.environments]
jupyter = ["jupyter"]
