[project]
authors = [{ name = "Jan Eglinger", email = "jan.eglinger@fmi.ch" }]
dependencies = [
  "ngio>=0.5.3,<0.6",
  "pandas>=2.3.3,<3",
  "cyclopts>=4.5.0,<5",
  "mobiedantic>=0.7.0,<0.8",
  "loguru>=0.7.3,<0.8",
  "natsort>=8.4.0,<9",
  "scikit-image>=0.26.0,<0.27",
]
dynamic = ["version"]
name = "mozarrt"
requires-python = ">= 3.12"
description = "MoBIE OME-Zarr Tools"

[project.scripts]
mozarrt = "mozarrt.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64", "osx-64"]

[tool.pixi.pypi-dependencies]
mozarrt = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ngio = ">=0.5.3,<0.6"
pandas = ">=2.3.3,<3"
cyclopts = ">=4.5.0,<5"
loguru = ">=0.7.3,<0.8"
natsort = ">=8.4.0,<9"
scikit-image = ">=0.26.0,<0.27"

[tool.pixi.feature.build.dependencies]
hatch = ">=1.16.3,<2"

[tool.pixi.feature.build.tasks]
build = "hatch build"

[tool.pixi.feature.jupyter.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"

[tool.pixi.feature.test.tasks]
test = "pytest --cov=src --cov-report term-missing"
cov-xml = "pytest --cov=src --cov-report xml"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["py312"]
build = { features = ["build"], no-default-feature = true }
jupyter = ["jupyter"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
